name: Windows 构建与验证

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: 安装开发依赖
        run: npm ci
      - name: 编译窗口桥
        run: npm run build:native
      - name: 检查语法
        run: npm run check
      - name: 准备隔离音效测试缓存
        run: node scripts/fetch-reference-audio.mjs
      - name: 验证统计、交互与真实 Windows 窗口
        run: npm test
      - name: 验证桌面应用
        run: npm run test:windows
        timeout-minutes: 3
      - name: 验证静默启动与 Codex 联动
        run: npm run test:startup
        timeout-minutes: 3
      - name: 验证位置和音效重启恢复
        run: npm run test:position
        timeout-minutes: 3
      - name: 验证气泡缩放与原生滚动条
        run: npm run test:bubble
        timeout-minutes: 3
      - name: 验证眼睛和身体跟随
        run: npm run test:eyes
        timeout-minutes: 3
      - name: 验证自然眨眼
        run: npm run test:blink
        timeout-minutes: 3
      - name: 验证开心星光
        run: npm run test:expression
        timeout-minutes: 3
      - name: 验证失败伤心表情
        run: npm run test:sad
        timeout-minutes: 3
      - name: 验证账号测智界面与本地协议
        run: npm run test:accounts
        timeout-minutes: 3
      - name: 构建 Windows 便携包
        run: npm run package:win
      - name: 验证解压后的安装包
        run: npm run verify:windows
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-x64
          path: |
            output/*-Windows-x64.zip
            output/release-manifest-Windows-x64.json
            output/verification-Windows-x64.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-expression-validation
          path: |
            .artifacts/eyes-*.png
            .artifacts/eyes-report.json
            .artifacts/blink-*.png
            .artifacts/blink-report.json
            .artifacts/happy-*.png
            .artifacts/expression-*.json
            .artifacts/sad-*.png
            .artifacts/sad-*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-bubble-validation
          path: |
            .artifacts/bubble-scrollbar-*.png
            .artifacts/bubble-scrollbar-report.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

name: Windows 构建与验证

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: 安装开发依赖
        run: npm ci
      - name: 编译窗口桥
        run: npm run build:native
      - name: 检查语法
        run: npm run check
      - name: 准备隔离音效测试缓存
        run: node scripts/fetch-reference-audio.mjs
      - name: 验证统计、交互与真实 Windows 窗口
        run: npm test
      - name: 构建 Windows 便携包与安装版
        run: npm run package:win
      - name: 在临时 Windows 环境验证安装、应用内升级和重启
        run: node scripts/windows-update-install-smoke.mjs
      # 桌面功能统一用解压后的便携包验收，包含原先源码阶段的账号测智。
      - name: 验证便携包与桌面功能
        run: npm run verify:windows
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-x64
          path: |
            output/*-Windows-x64.zip
            output/*-Windows-x64-Setup.exe
            output/release-manifest-Windows-x64.json
            output/verification-Windows-x64.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-window-validation
          path: |
            .artifacts/follow-report.json
            .artifacts/follow-drag-report.json
            .artifacts/menu-report.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-performance-validation
          path: .artifacts/project-audit/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-expression-validation
          path: |
            .artifacts/eyes-*.png
            .artifacts/eyes-report.json
            .artifacts/blink-*.png
            .artifacts/blink-report.json
            .artifacts/happy-*.png
            .artifacts/expression-*.json
            .artifacts/sad-*.png
            .artifacts/sad-*.json
            .artifacts/facing-*.png
            .artifacts/facing-report.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-character-validation
          path: |
            .artifacts/maro-integration/
            .artifacts/maro-audit/frame-audit.json
            .artifacts/maro-interaction/
            .artifacts/maro-gaze-pixels/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-bubble-validation
          path: |
            .artifacts/bubble-scrollbar-*.png
            .artifacts/bubble-scrollbar-report.json
            .artifacts/bubble-refresh-report.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
